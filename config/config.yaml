# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件 - Nelson定制版
#                      Version: 2.2.0
# ═══════════════════════════════════════════════════════════════

app:
  timezone: "Asia/Shanghai"
  show_version_update: true

schedule:
  enabled: true
  preset: "morning_evening"

# ===============================================================
# 热榜平台（保留最相关的）
# ===============================================================
platforms:
  enabled: true
  sources:
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
    - id: "cls-hot"
      name: "财联社热门"
    - id: "weibo"
      name: "微博"
    - id: "zhihu"
      name: "知乎"
    - id: "toutiao"
      name: "今日头条"
    - id: "thepaper"
      name: "澎湃新闻"

# ===============================================================
# RSS 订阅源
# ===============================================================
rss:
  enabled: true

  freshness_filter:
    enabled: true
    max_age_days: 1

  feeds:
    # ── 美股 & 全球金融 ──────────────────────────────────────────
    - id: "reuters-business"
      name: "Reuters Business"
      url: "https://feeds.reuters.com/reuters/businessNews"

    - id: "cnbc-finance"
      name: "CNBC Finance"
      url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664"

    - id: "cnbc-markets"
      name: "CNBC Markets"
      url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=15839135"

    - id: "marketwatch"
      name: "MarketWatch Top Stories"
      url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"

    - id: "yahoo-finance"
      name: "Yahoo Finance"
      url: "https://finance.yahoo.com/news/rssindex"

    - id: "ft-markets"
      name: "Financial Times Markets"
      url: "https://www.ft.com/markets?format=rss"

    - id: "bloomberg-markets"
      name: "Bloomberg Markets"
      url: "https://feeds.bloomberg.com/markets/news.rss"

    - id: "bloomberg-tech"
      name: "Bloomberg Technology"
      url: "https://feeds.bloomberg.com/technology/news.rss"

    - id: "wsj-markets"
      name: "WSJ Markets"
      url: "https://feeds.content.dowjones.io/public/rss/mw_marketpulse"

    - id: "seeking-alpha"
      name: "Seeking Alpha"
      url: "https://seekingalpha.com/market_currents.xml"
      max_age_days: 1

    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"

    # ── 国际展会 & 会展行业 ───────────────────────────────────────
    - id: "ufi-news"
      name: "UFI全球展览协会"
      url: "https://www.ufi.org/feed/"
      max_age_days: 7

    - id: "tsnn-news"
      name: "TSNN展会新闻"
      url: "https://www.tsnn.com/rss.xml"
      max_age_days: 3

    - id: "exhibitor-online"
      name: "Exhibitor Online"
      url: "https://www.exhibitoronline.com/rss/news.asp"
      max_age_days: 3

    - id: "tradeshow-executive"
      name: "Tradeshow Executive"
      url: "https://tradeshowexecutive.com/feed/"
      max_age_days: 7

    - id: "informa-markets"
      name: "Informa Markets News"
      url: "https://www.informamarkets.com/en/news.rss"
      max_age_days: 7

    # ── 儿童教育 & EdTech ─────────────────────────────────────────
    - id: "edsurge"
      name: "EdSurge教育科技"
      url: "https://www.edsurge.com/feeds/news"
      max_age_days: 3

    - id: "edweek"
      name: "Education Week"
      url: "https://www.edweek.org/feed"
      max_age_days: 3

    - id: "mindshift"
      name: "MindShift儿童学习"
      url: "https://feeds.feedburner.com/MindShift-KQED"
      max_age_days: 7

    - id: "getting-smart"
      name: "Getting Smart教育创新"
      url: "https://www.gettingsmart.com/feed/"
      max_age_days: 7

    - id: "edtechmagazine"
      name: "EdTech Magazine"
      url: "https://edtechmagazine.com/k12/rss.xml"
      max_age_days: 3

# ===============================================================
# 报告模式
# ===============================================================
report:
  mode: "current"
  display_mode: "keyword"
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 0

# ===============================================================
# 筛选策略
# ===============================================================
filter:
  method: "ai"
  priority_sort_enabled: true

ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.65
  reclassify_threshold: 0.6
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"

# ===============================================================
# 推送内容控制
# ===============================================================
display:
  region_order:
    - new_items
    - hotlist
    - rss
    - ai_analysis

  regions:
    hotlist: true
    new_items: false
    rss: true
    standalone: false
    ai_analysis: true

  standalone:
    platforms: ["wallstreetcn-hot", "zhihu"]
    rss_feeds: []
    max_items: 20

# ===============================================================
# 推送通知（webhook 通过 GitHub Secrets 注入）
# ===============================================================
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ""   # 通过 GitHub Secret FEISHU_WEBHOOK_URL 注入

    dingtalk:
      webhook_url: ""

    wework:
      webhook_url: ""
      msg_type: "markdown"

    telegram:
      bot_token: ""
      chat_id: ""

    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""

    ntfy:
      server_url: "https://ntfy.sh"
      topic: ""
      token: ""

    bark:
      url: ""

    slack:
      webhook_url: ""

    generic_webhook:
      webhook_url: ""
      payload_template: ""

# ===============================================================
# 存储
# ===============================================================
storage:
  backend: "auto"
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: "output"
    retention_days: 30
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  pull:
    enabled: false
    days: 7

# ===============================================================
# AI 模型（OpenAI GPT-4o-mini，通过 GitHub Secret 注入 API Key）
# ===============================================================
ai:
  model: "openai/gpt-4o-mini"
  api_key: ""           # 通过 GitHub Secret AI_API_KEY 注入
  api_base: ""
  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 2
  fallback_models: []

# ===============================================================
# AI 分析
# ===============================================================
ai_analysis:
  enabled: true
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "follow_report"
  max_news_for_analysis: 80
  include_rss: true
  include_standalone: true
  include_rank_timeline: false

# ===============================================================
# AI 翻译（将英文RSS标题翻译为中文）
# ===============================================================
ai_translation:
  enabled: true
  language: "中文"
  prompt_file: "ai_translation_prompt.txt"
  scope:
    hotlist: false
    rss: true
    standalone: false

# ===============================================================
# 高级设置
# ===============================================================
advanced:
  debug: false
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: "http://127.0.0.1:10801"
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ""
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    feishu: 30000
  batch_send_interval: 3
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
